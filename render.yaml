# Render Blueprint - College Document Management Portal
# Deploy both services from the Render dashboard: New + -> Blueprint -> select this repo.

services:
  # ---------------------------------------------------------------------------
  # Backend - Django REST API (Gunicorn)
  # ---------------------------------------------------------------------------
  - type: web
    name: documents-portal-api
    runtime: python
    pythonVersion: "3.13.1"
    rootDir: backend
    buildCommand: bash build.sh
    # 2 workers x 4 threads = 8 concurrent requests per instance. Bump the
    # workers when you upgrade to a larger instance (see README -> Scaling).
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        sync: false # paste the Supabase transaction-mode pooler URL
      - key: DIRECT_URL
        sync: false # paste the Supabase session-mode pooler URL
      - key: PBKDF2_ITERATIONS
        value: "216000" # 3x faster logins; set 720000 for max password-hash security
      - key: THROTTLE_LOGIN_RATE
        value: "60/min" # per-IP; 60/min avoids 429s when a campus shares one public IP (mobile NAT)
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://documents-portal.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: NVIDIA_API_KEY
        sync: false # paste the NVIDIA 30B model key (nvapi-...)
      - key: NVIDIA_RAG_API_KEY
        sync: false # paste the NVIDIA RAG key (optional - falls back to NVIDIA_API_KEY)
      - key: NVIDIA_RAG_MODEL
        value: "nvidia/nim-rag"
      - key: MAX_PDF_SIZE_MB
        value: "20"
      - key: ADMIN_ROLL_NUMBER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false # your super admin password

  # ---------------------------------------------------------------------------
  # Cron - daily AI request log cleanup
  # ---------------------------------------------------------------------------
  # Runs once a day and prunes AI request log rows older than
  # AI_LOG_RETENTION_DAYS (default 30) so the log never grows forever.
  # NOTE: Render Cron Jobs require a paid plan (Starter $7/mo or higher) -
  # there is no free-tier cron. If you skip this service, admins can still
  # prune manually from Admin -> AI Management -> Usage ("Clear logs older
  # than 30 days" button).
  - type: cron
    name: documents-portal-ai-log-cleanup
    runtime: python
    pythonVersion: "3.13.1"
    rootDir: backend
    schedule: "0 3 * * *" # daily at 03:00 UTC (≈ 08:30 IST)
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py cleanup_ai_logs
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true # fresh value is fine - cleanup never decrypts stored keys
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        sync: false # same Supabase transaction-mode pooler URL as the API
      - key: DIRECT_URL
        sync: false # same Supabase session-mode pooler URL as the API
      - key: AI_LOG_RETENTION_DAYS
        value: "30" # how many days of AI request logs to keep

  # ---------------------------------------------------------------------------
  # Frontend - Next.js (Node)
  # ---------------------------------------------------------------------------
  - type: web
    name: documents-portal-web
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false # e.g. https://documents-portal-api.onrender.com/api
